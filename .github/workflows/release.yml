name: Release

# Push a tag like v0.2.0 to build every platform and attach the packages to a
# draft GitHub release. Review the draft, then publish it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The injector and agent are Windows programs on every platform (Linux runs
  # them inside Proton), so they are built once here and shared.
  tools:
    name: Windows tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Shared with warm-cache.yml, which keeps this cache built on main (a
      # tag can read main's caches, not other tags'). Tags don't save.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-tools
          save-if: false
      # Only what the packages bundle; sc-launch.exe is built by Package (windows).
      - name: Build sc-inject and sc-agent
        run: cargo build --release --locked -p sc-inject -p sc-agent
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          path: |
            target/release/sc-inject.exe
            target/release/sc_agent.dll
          if-no-files-found: error

  bundle:
    name: Package (${{ matrix.name }})
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Skip rebuilding the man page index after installing: on GitHub's
          # runners that trigger alone can take many minutes.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm
      - uses: actions/download-artifact@v4
        with:
          name: windows-tools
          path: dist/tools
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./gui/src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; }
      - name: Build launcher packages
        working-directory: gui/src-tauri
        # Signs the self-update files (*.sig); the public half is
        # plugins.updater.pubkey in tauri.conf.json.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --ci --config tauri.release.conf.json
      - name: Build sc-launch (CLI)
        run: cargo build --release --locked -p sc-launch
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./gui/src-tauri/tauri.conf.json').version")
          mkdir -p out cli
          cp dist/tools/sc-inject.exe dist/tools/sc_agent.dll cli/
          shopt -s nullglob
          if [ "$RUNNER_OS" = Linux ]; then
            cp target/release/bundle/deb/*.deb* target/release/bundle/rpm/*.rpm* target/release/bundle/appimage/*.AppImage* out/
            cp target/release/sc-launch cli/
            tar -czf "out/sc-launch_${version}_linux_x64.tar.gz" -C cli .
          else
            cp target/release/bundle/msi/*.msi* target/release/bundle/nsis/*.exe* out/
            cp target/release/sc-launch.exe cli/
            (cd cli && 7z a "../out/sc-launch_${version}_windows_x64.zip" . >/dev/null)
          fi
          # GitHub turns spaces in asset names into dots; do it here so the
          # links in latest.json match.
          for f in out/*\ *; do mv "$f" "${f// /.}"; done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release notes are this version's section of CHANGELOG.md.
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{on = ($2 == v); next} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: out
          merge-multiple: true
      # The launcher's updater reads releases/latest/download/latest.json, so
      # it sees a version once its release is published (not while a draft).
      - name: Write latest.json
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          platforms='{}'
          for sig in out/*.sig; do
            file=$(basename "${sig%.sig}")
            case "$file" in
              *.AppImage) key=linux-x86_64-appimage ;;
              *.deb) key=linux-x86_64-deb ;;
              *.rpm) key=linux-x86_64-rpm ;;
              *-setup.exe) key=windows-x86_64-nsis ;;
              *.msi) key=windows-x86_64-msi ;;
              *) continue ;;
            esac
            platforms=$(jq --arg k "$key" --arg url "$base/$file" --rawfile sig "$sig" \
              '. + {($k): {url: $url, signature: ($sig | rtrimstr("\n"))}}' <<<"$platforms")
          done
          [ "$platforms" != '{}' ] || { echo "no update signatures: are the TAURI_SIGNING_PRIVATE_KEY secrets set?"; exit 1; }
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --argjson p "$platforms" '{version: $v, pub_date: $date, page: $page, platforms: $p}' > out/latest.json
          cat out/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: notes.md
          files: out/*
