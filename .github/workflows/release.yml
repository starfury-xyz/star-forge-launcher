name: Release

# Push a tag like v0.3.0 to build the packages and attach them to a draft GitHub release, with
# the release notes from CHANGELOG.md and the signed latest.json installed launchers update from.
# Review the draft, then publish it: launchers only see published releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^project(starforge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but CMakeLists.txt says $have"; exit 1; }
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows
          variant: sccache
          # The cache ci.yml saves on main.
          save: false
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          # Release builds update themselves from this repository's newest published release.
          cmake --preset win64-msvc -DSF_UPDATE_ENDPOINT="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          cmake --build --preset win64-msvc --target star_forge sc_launch sc_inject sc_agent sc_server
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(starforge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          b=build/win64
          mkdir -p out launcher/tools cli tools
          # The launcher looks for the injector, agent and server supervisor in tools/ next to it.
          cp $b/star-forge.exe launcher/
          cp $b/sc-inject.exe $b/sc_agent.dll $b/sc-server.exe launcher/tools/
          cp $b/sc-launch.exe $b/sc-inject.exe $b/sc_agent.dll $b/sc-server.exe cli/
          # For the Linux job: the tools go in its packages, and it builds the Windows installer.
          cp $b/star-forge.exe $b/sc-inject.exe $b/sc_agent.dll $b/sc-server.exe tools/
          (cd launcher && 7z a "../out/STAR_FORGE_Launcher-${version}-windows-x64.zip" . >/dev/null)
          (cd cli && 7z a "../out/sc-launch_${version}_windows_x64.zip" . >/dev/null)
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tools
          path: tools/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev patchelf librsvg2-dev dpkg-dev rpm nsis
      - uses: actions/download-artifact@v4
        with:
          name: windows-tools
          path: win-tools
      - name: Fetch AppImage tools
        run: |
          set -euo pipefail
          mkdir -p appimage-tools && cd appimage-tools
          curl -fsSLo linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLo linuxdeploy-plugin-appimage.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          # Tauri's fork of the gtk plugin: unlike upstream's, it points the bundled WebKitGTK at
          # its bundled helper processes.
          curl -fsSLo linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/dda522bce37387f1b853d9095713bfaa924c8423/linuxdeploy-plugin-gtk.sh
          echo "7804c9eef13e59bf2783aad9882ef9db8f3f3f9e8d631874b1d348d550a3693f  linuxdeploy-plugin-gtk.sh" | sha256sum -c
          # AppImageKit's AppRun (the project is archived; this is its last build).
          curl -fsSLo AppRun-x86_64 https://github.com/AppImage/AppImageKit/releases/download/continuous/AppRun-x86_64
          echo "f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  AppRun-x86_64" | sha256sum -c
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux
          # The cache ci.yml saves on main.
          save: false
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake --preset linux -DSF_UPDATE_ENDPOINT="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          cmake --build --preset linux --target star_forge sc_launch
      - name: AppImage
        run: TOOLS="$PWD/appimage-tools" WIN_TOOLS="$PWD/win-tools" packaging/appimage.sh
      - name: deb and rpm
        run: WIN_TOOLS="$PWD/win-tools" packaging/linux-packages.sh
      - name: Windows installer
        run: WIN_BUILD="$PWD/win-tools" packaging/nsis.sh
      - name: Collect release files
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(starforge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p out cli
          cp build/appimage/*.AppImage build/packages/*.deb build/packages/*.rpm build/packages/*-setup.exe out/
          cp build/linux/sc-launch win-tools/sc-inject.exe win-tools/sc_agent.dll win-tools/sc-server.exe cli/
          strip cli/sc-launch
          tar -czf "out/sc-launch_${version}_linux_x64.tar.gz" -C cli .
          ls -l out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Signatures for the self-update (<file>.sig, minisign), with the key launchers since 0.2.1
      # check (SF_UPDATE_PUBKEY in CMakeLists.txt). Tauri's signer, as the launcher was first built
      # with Tauri; its updater reads the same latest.json.
      - name: Sign for the self-update
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: no update signatures"
            exit 0
          fi
          for f in out/*.AppImage out/*.deb out/*.rpm out/*-setup.exe; do
            npx --yes @tauri-apps/cli@2 signer sign "$f"
            test -s "$f.sig"
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release notes are this version's section of CHANGELOG.md.
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{on = ($2 == v); next} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: out
          merge-multiple: true
      # Installed launchers read releases/latest/download/latest.json, so they see a version once
      # its release is published. Keys are tauri-plugin-updater's: launchers up to 0.2.6 (Tauri)
      # ask for <os>-<arch>-<how they were installed> first, then <os>-<arch>; this launcher asks
      # for windows-x86_64-nsis or linux-x86_64-appimage. 0.2 .msi installs get the setup .exe,
      # which offers to remove the old copy.
      - name: Write latest.json
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          platforms='{}'
          add() {  # <key> <file>
            platforms=$(jq --arg k "$1" --arg url "$base/$(basename "$2")" --rawfile sig "$2.sig" \
              '. + {($k): {url: $url, signature: ($sig | rtrimstr("\n"))}}' <<<"$platforms")
          }
          shopt -s nullglob
          for sig in out/*.sig; do
            file="${sig%.sig}"
            case "$file" in
              *.AppImage) add linux-x86_64-appimage "$file"; add linux-x86_64 "$file" ;;
              *.deb) add linux-x86_64-deb "$file" ;;
              *.rpm) add linux-x86_64-rpm "$file" ;;
              *-setup.exe) add windows-x86_64-nsis "$file"; add windows-x86_64-msi "$file"; add windows-x86_64 "$file" ;;
            esac
          done
          [ "$platforms" != '{}' ] || { echo "no update signatures: are the TAURI_SIGNING_PRIVATE_KEY secrets set?"; exit 1; }
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg page "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --argjson p "$platforms" '{version: $v, pub_date: $date, page: $page, platforms: $p}' > out/latest.json
          cat out/latest.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft --notes-file notes.md
