name: Warm release cache

# Release builds run on tags, and a tag can only read caches saved on the
# default branch. This keeps optimized builds of the launcher and the Windows
# tools cached on main, under the keys release.yml restores, so a release
# compiles little more than our own crates.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'samples/**', 'schemas/**']
  workflow_dispatch:

concurrency:
  group: warm-cache
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tools:
    name: Windows tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-tools
      - run: cargo build --release --locked -p sc-inject -p sc-agent

  launcher:
    name: Launcher (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # Same compile as Release's "Build launcher packages", minus the
      # installers (and the bundled tools, which only the packages need).
      - name: Build the launcher
        working-directory: gui/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --ci --no-bundle
      - run: cargo build --release --locked -p sc-launch
